<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220">
<title>React en órbita</title>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#20264c"/><stop offset="1" stop-color="#12182f"/></linearGradient></defs>
<rect width="360" height="220" rx="22" fill="url(#bg)"/>
<text x="23" y="35" fill="#a8b5ff" font-family="monospace" font-size="13" letter-spacing="2">REACT / RENDER CYCLE</text>
<g transform="translate(180 105)">
 <ellipse rx="82" ry="31" fill="none" stroke="#73d9ff" stroke-width="4">
  <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse rx="82" ry="31" fill="none" stroke="#73d9ff" stroke-width="4" transform="rotate(60)">
  <animateTransform attributeName="transform" type="rotate" values="60;420" dur="8s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse rx="82" ry="31" fill="none" stroke="#73d9ff" stroke-width="4" transform="rotate(120)">
  <animateTransform attributeName="transform" type="rotate" values="120;480" dur="10s" repeatCount="indefinite"/>
 </ellipse>
 <circle r="18" fill="#68c9ee"/>
 <circle cx="-6" cy="-3" r="2.5" fill="#142747"/><circle cx="6" cy="-3" r="2.5" fill="#142747"/>
 <path d="M-6 6Q0 10 6 6" fill="none" stroke="#142747" stroke-width="2" stroke-linecap="round"/>
</g>
<rect x="22" y="181" width="316" height="24" rx="12" fill="#161c38" stroke="#4a5689"/>
<text x="48" y="197" fill="#b9c3e8" font-family="monospace" font-size="12">state changed: vuelta a empezar</text>
</svg>