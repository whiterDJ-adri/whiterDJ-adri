<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Side quests de desarrollo</title>
<desc id="desc">Un pingüino Linux pasea, una nave Arch despega y React orbita sobre un fondo nocturno de arcade.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10152d"/>
    <stop offset=".56" stop-color="#20244c"/>
    <stop offset="1" stop-color="#381b4e"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#292956"/>
    <stop offset="1" stop-color="#15182e"/>
  </linearGradient>
  <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffe66d"/><stop offset="1" stop-color="#ff5d8f"/>
  </linearGradient>
</defs>
<rect width="1200" height="430" rx="28" fill="url(#sky)"/>
<circle cx="1042" cy="84" r="42" fill="#ffdc70" opacity=".12"/>
<circle cx="1042" cy="84" r="27" fill="#ffdc70" opacity=".18"/>
<g fill="#e8edff" opacity=".75">
 <circle cx="112" cy="93" r="2"/><circle cx="257" cy="72" r="2"/><circle cx="360" cy="115" r="1.7"/>
 <circle cx="505" cy="76" r="2"/><circle cx="631" cy="104" r="1.6"/><circle cx="798" cy="69" r="2"/>
 <circle cx="911" cy="126" r="1.7"/><circle cx="1140" cy="144" r="2"/>
</g>
<text x="48" y="54" fill="#94a3ff" font-family="monospace" font-size="15" letter-spacing="3">SIDE QUESTS / DEV LAB</text>
<text x="48" y="103" fill="#f4f3ff" font-family="system-ui,sans-serif" font-size="32" font-weight="800">El código compila. La aventura empieza.</text>
<text x="50" y="132" fill="#b9bfdc" font-family="monospace" font-size="14">linux.exe · arch.launch() · react.render()</text>

<!-- Terminal cloud -->
<g transform="translate(48 177)">
 <rect width="254" height="92" rx="13" fill="#111527" stroke="#6975bb" stroke-width="2"/>
 <circle cx="18" cy="17" r="4" fill="#ff6f91"/><circle cx="33" cy="17" r="4" fill="#ffd86f"/><circle cx="48" cy="17" r="4" fill="#7be2b8"/>
 <text x="17" y="48" fill="#84ecc1" font-family="monospace" font-size="14">$ npm run dev</text>
 <text x="17" y="72" fill="#d4d8f2" font-family="monospace" font-size="12">listening... (¡por fin!)</text>
 <rect x="228" y="60" width="8" height="15" fill="#ffd86f">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
 </rect>
</g>

<!-- Linux penguin on its little patrol -->
<g transform="translate(411 288)">
 <animateTransform attributeName="transform" type="translate" values="411 288;423 284;411 288" dur="1.4s" repeatCount="indefinite"/>
 <ellipse cx="0" cy="86" rx="61" ry="9" fill="#0b1021" opacity=".55"/>
 <g>
  <animateTransform attributeName="transform" type="rotate" values="-3 0 30;3 0 30;-3 0 30" dur="1.4s" repeatCount="indefinite"/>
  <ellipse cx="0" cy="28" rx="37" ry="53" fill="#171a26"/>
  <ellipse cx="0" cy="41" rx="25" ry="34" fill="#f4f1e8"/>
  <circle cx="-12" cy="-8" r="14" fill="#171a26"/><circle cx="12" cy="-8" r="14" fill="#171a26"/>
  <circle cx="-11" cy="-5" r="4" fill="#fff"/><circle cx="13" cy="-5" r="4" fill="#fff"/>
  <circle cx="-10" cy="-5" r="2" fill="#17213d"/><circle cx="14" cy="-5" r="2" fill="#17213d"/>
  <path d="M-8 7 Q0 0 9 7 L0 17Z" fill="#ff9e50"/>
  <path d="M-30 23 Q0 36 30 23 L27 34 Q0 45 -27 34Z" fill="#74e2ca"/>
 </g>
 <path d="M-25 75 Q-37 83 -49 78 M20 76 Q32 84 44 77" fill="none" stroke="#ff9e50" stroke-width="8" stroke-linecap="round">
  <animate attributeName="d" values="M-25 75 Q-37 83 -49 78 M20 76 Q32 84 44 77;M-25 77 Q-35 72 -47 77 M20 77 Q34 72 46 77;M-25 75 Q-37 83 -49 78 M20 76 Q32 84 44 77" dur="1.4s" repeatCount="indefinite"/>
 </path>
 <text x="-38" y="112" fill="#b9bfdc" font-family="monospace" font-size="12">LINUX / en ronda</text>
</g>

<!-- Arch-inspired rocket -->
<g transform="translate(691 240)">
 <animateTransform attributeName="transform" type="translate" values="691 260;691 223;691 260" dur="2.5s" repeatCount="indefinite"/>
 <ellipse cx="0" cy="133" rx="48" ry="8" fill="#0b1021" opacity=".5"/>
 <g>
  <path d="M0 -52 L31 36 L0 24 L-31 36Z" fill="#83b9ff" stroke="#dceaff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M0 -34 L0 17" stroke="#15244b" stroke-width="4"/>
  <circle cx="0" cy="-1" r="10" fill="#ffe66d" stroke="#25345f" stroke-width="3"/>
  <path d="M-28 27 L-46 47 L-20 41 M28 27 L46 47 L20 41" fill="#ff668b" stroke="#ffc2d3" stroke-width="2"/>
  <path d="M-16 39 Q0 70 16 39 Q12 73 0 88 Q-12 73 -16 39Z" fill="url(#flame)">
   <animate attributeName="d" values="M-16 39 Q0 70 16 39 Q12 73 0 88 Q-12 73 -16 39Z;M-16 39 Q0 82 16 39 Q12 88 0 101 Q-12 88 -16 39Z;M-16 39 Q0 70 16 39 Q12 73 0 88 Q-12 73 -16 39Z" dur=".45s" repeatCount="indefinite"/>
  </path>
 </g>
 <text x="-26" y="119" fill="#b9bfdc" font-family="monospace" font-size="12">ARCH / despegando</text>
</g>

<!-- React orbit with a tiny, overworked planet -->
<g transform="translate(958 272)">
 <ellipse cx="0" cy="0" rx="76" ry="28" fill="none" stroke="#74d9ff" stroke-width="4" transform="rotate(30)">
  <animateTransform attributeName="transform" type="rotate" values="30;390" dur="7s" repeatCount="indefinite" additive="replace"/>
 </ellipse>
 <ellipse cx="0" cy="0" rx="76" ry="28" fill="none" stroke="#74d9ff" stroke-width="4" transform="rotate(-30)">
  <animateTransform attributeName="transform" type="rotate" values="-30;330" dur="9s" repeatCount="indefinite" additive="replace"/>
 </ellipse>
 <ellipse cx="0" cy="0" rx="76" ry="28" fill="none" stroke="#74d9ff" stroke-width="4"/>
 <circle cx="0" cy="0" r="17" fill="#68c9ee"/>
 <circle cx="-5" cy="-2" r="2.5" fill="#132440"/><circle cx="5" cy="-2" r="2.5" fill="#132440"/>
 <path d="M-5 6 Q0 10 5 6" fill="none" stroke="#132440" stroke-width="2" stroke-linecap="round"/>
 <text x="-23" y="76" fill="#b9bfdc" font-family="monospace" font-size="12">REACT / en órbita</text>
</g>

<path d="M0 370 Q160 347 310 370 T620 370 T930 370 T1200 365 V430 H0Z" fill="url(#ground)"/>
<path d="M0 370 Q160 347 310 370 T620 370 T930 370 T1200 365" fill="none" stroke="#59629e" stroke-width="2"/>
<g transform="translate(315 385)">
 <rect width="245" height="27" rx="13" fill="#22294c" stroke="#48558b"/>
 <text x="14" y="18" fill="#e4e8ff" font-family="monospace" font-size="12">BUGS FOUND: 3  ·  FIXED: 2.5</text>
</g>
<g transform="translate(745 385)">
 <text fill="#8d96c5" font-family="monospace" font-size="12">la media excepción sigue en investigación</text>
</g>
</svg>