# Genera la animación de la serpiente a partir del gráfico de contribuciones
# y la publica en la rama "output". El README la carga desde ahí.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "17 3 * * *"   # cada noche
  workflow_dispatch:         # botón para lanzarla a mano desde la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dibujar la serpiente con los colores de la oni
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/oni-snake-dark.svg?palette=github-dark&color_snake=#FF2D87&color_dots=#202125,#4d4500,#8f8000,#d1bb00,#FFE707
            dist/oni-snake-light.svg?palette=github-light&color_snake=#FF2D87&color_dots=#ebedf0,#fff4a3,#ffe94f,#e6c800,#b39b00

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
